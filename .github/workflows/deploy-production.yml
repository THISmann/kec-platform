name: Deploy production (VPS + Cloudflare)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /

      - name: Sync files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          source: "dist,compose.yaml,deploy/nginx.conf,deploy/security-headers.conf,deploy/traefik-kec.yml"
          target: /opt/kec-platform
          strip_components: 0
          overwrite: true

      - name: Reload container and Traefik route
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            set -euo pipefail
            cp /opt/kec-platform/deploy/traefik-kec.yml /root/fbsolar/docker/traefik/dynamic/kec.yml
            cd /opt/kec-platform
            docker compose up -d --remove-orphans
            docker exec kec-platform wget -qO- http://127.0.0.1/ >/dev/null

      - name: Point Cloudflare DNS at the VPS and purge cache
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          VPS_IP: ${{ secrets.VPS_HOST }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ZONE" ]; then
            echo "Cloudflare secrets not set; skip DNS + cache"
            exit 0
          fi
          upsert() {
            local name="$1"
            local list payload rec_id
            list=$(curl -sS -X GET "https://api.cloudflare.com/client/v4/zones/${CF_ZONE}/dns_records?type=A&name=${name}" \
              -H "Authorization: Bearer ${CF_TOKEN}" -H "Content-Type: application/json")
            rec_id=$(printf '%s' "$list" | python3 -c "import sys,json; d=json.load(sys.stdin); r=d.get('result') or []; print(r[0]['id'] if r else '')")
            payload=$(printf '{"type":"A","name":"%s","content":"%s","ttl":1,"proxied":true}' "$name" "$VPS_IP")
            if [ -n "$rec_id" ]; then
              curl -sS -X PUT "https://api.cloudflare.com/client/v4/zones/${CF_ZONE}/dns_records/${rec_id}" \
                -H "Authorization: Bearer ${CF_TOKEN}" -H "Content-Type: application/json" --data "$payload"
            else
              curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE}/dns_records" \
                -H "Authorization: Bearer ${CF_TOKEN}" -H "Content-Type: application/json" --data "$payload"
            fi
            echo
          }
          upsert "kec-africa.com"
          upsert "www.kec-africa.com"
          curl -sS -X PATCH "https://api.cloudflare.com/client/v4/zones/${CF_ZONE}/settings/ssl" \
            -H "Authorization: Bearer ${CF_TOKEN}" -H "Content-Type: application/json" \
            --data '{"value":"full"}'
          echo
          curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE}/purge_cache" \
            -H "Authorization: Bearer ${CF_TOKEN}" -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
          echo
